<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dhireynta Dhulka Initiative (DDI) — Restoring Our Land, Securing Our Future</title>
    <meta
      name="description"
      content="DDI is a Somali environmental restoration initiative: indigenous tree planting, semi-circular bunds and community climate resilience."
    >
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="w nav">
        <a class="logo" href="#home"><i></i>DDI</a>
        <button class="burger" id="bg" aria-label="Menu">☰</button>

        <nav id="nv">
          <a href="#home" data-t="n1"></a>
          <a href="#about" data-t="n2"></a>
          <a href="#projects" data-t="n3"></a>
          <a href="#impact" data-t="n4"></a>
          <a href="#approach" data-t="n5"></a>
          <a href="#involved" data-t="n6"></a>
          <a href="#news" data-t="n7"></a>
          <a href="#contact" data-t="n8"></a>
        </nav>

        <button class="lang" id="lg" aria-label="Language">SO</button>
        <a class="btn sup" href="#involved" data-t="sup"></a>
      </div>
    </header>

    <!-- Main page content -->
    <main>
      <!-- Hero section -->
      <section class="hero" id="home">
        <svg viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 160 Q150 120 300 150 T600 130 T900 140 T1200 110 V200 H0Z" fill="#064E3B"></path>
          <g fill="#0b6b3f">
            <circle cx="760" cy="112" r="16"></circle>
            <circle cx="830" cy="108" r="20"></circle>
            <circle cx="910" cy="104" r="24"></circle>
            <circle cx="1000" cy="96" r="28"></circle>
            <circle cx="1090" cy="90" r="30"></circle>
          </g>
        </svg>

        <div class="w">
          <div class="eyebrow" style="color:var(--sd)" data-t="tag"></div>
          <h1 data-t="h1"></h1>
          <p data-t="hp"></p>

          <div class="row">
            <a class="btn s" href="#about" data-t="b1"></a>
            <a class="btn o" href="#projects" data-t="b2"></a>
            <a class="btn o" href="#involved" data-t="b3"></a>
          </div>
        </div>
      </section>

      <!-- About section -->
      <section id="about">
        <div class="w two rv">
          <div class="pic">
            <span data-t="ph">Photo placeholder</span>
          </div>

          <div>
            <div class="eyebrow">DDI</div>
            <h2 data-t="ih"></h2>
            <p data-t="ip1"></p>
            <p data-t="ip2"></p>
            <a class="btn" href="#mission" data-t="lm"></a>
          </div>
        </div>
      </section>

      <!-- Mission section -->
      <section class="alt" id="mission">
        <div class="w rv">
          <div class="eyebrow" data-t="mh"></div>
          <h2 data-t="mt"></h2>

          <div class="grid" style="margin-top:24px">
            <div class="card pil">
              <h3 data-t="pl1"></h3>
              <p data-t="pd1"></p>
            </div>
            <div class="card pil">
              <h3 data-t="pl2"></h3>
              <p data-t="pd2"></p>
            </div>
            <div class="card pil">
              <h3 data-t="pl3"></h3>
              <p data-t="pd3"></p>
            </div>
          </div>

          <p>
            <b data-t="vh"></b>
            <span data-t="vt"></span>
          </p>
        </div>
      </section>

      <!-- Impact section -->
      <section id="impact">
        <div class="w rv">
          <div class="eyebrow" data-t="n4"></div>
          <h2 data-t="ik"></h2>
          <div class="grid" id="stats"></div>
          <p class="note" data-t="in"></p>
        </div>
      </section>

      <!-- Projects section -->
      <section class="alt" id="projects">
        <div class="w">
          <div class="eyebrow" data-t="n3"></div>
          <h2 data-t="ph2"></h2>
          <div class="grid" id="pj" style="margin-top:20px"></div>
          <p class="note" data-t="pn"></p>
        </div>
      </section>

      <!-- Approach section -->
      <section id="approach">
        <div class="w rv">
          <div class="eyebrow" data-t="n5"></div>
          <h2 data-t="ah"></h2>

          <div class="grid" style="margin-top:20px">
            <div class="card step">
              <b>01</b>
              <h3 data-t="s1"></h3>
              <p data-t="sd1"></p>
            </div>
            <div class="card step">
              <b>02</b>
              <h3 data-t="s2"></h3>
              <p data-t="sd2"></p>
            </div>
            <div class="card step">
              <b>03</b>
              <h3 data-t="s3"></h3>
              <p data-t="sd3"></p>
            </div>
            <div class="card step">
              <b>04</b>
              <h3 data-t="s4"></h3>
              <p data-t="sd4"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- Vision section -->
      <section class="alt">
        <div class="w rv">
          <div class="big">
            <div class="eyebrow" style="color:var(--sd)" data-t="fe"></div>
            <h2>GREEN SOMALIA 2030</h2>
            <p><b data-t="fs"></b></p>
            <p data-t="fd"></p>

            <div class="grid">
              <div>
                <b data-t="fo"></b>
                <ul data-t="fol"></ul>
              </div>
              <div>
                <b data-t="fa"></b>
                <ul data-t="fal"></ul>
              </div>
            </div>

            <a class="btn s" href="#contact" data-t="fb"></a>
          </div>
        </div>
      </section>

      <!-- Get involved section -->
      <section id="involved">
        <div class="w rv">
          <div class="eyebrow" data-t="n6"></div>
          <h2 data-t="jh"></h2>
          <p data-t="jp"></p>

          <div class="grid">
            <div class="card">
              <h3 data-t="j1"></h3>
              <p data-t="jd1"></p>
              <a class="btn" href="#contact" data-t="jb1"></a>
            </div>
            <div class="card">
              <h3 data-t="j2"></h3>
              <p data-t="jd2"></p>
              <a class="btn" href="#contact" data-t="jb2"></a>
            </div>
            <div class="card">
              <h3 data-t="j3"></h3>
              <p data-t="jd3"></p>
              <a class="btn" href="#contact" data-t="jb3"></a>
            </div>
          </div>
        </div>
      </section>

      <!-- Research / reporting section -->
      <section class="alt">
        <div class="w rv">
          <h2 data-t="rh"></h2>
          <p data-t="rp"></p>
          <p class="note" data-t="rn"></p>
        </div>
      </section>

      <!-- News section -->
      <section id="news">
        <div class="w rv">
          <div class="eyebrow" data-t="n7"></div>
          <h2 data-t="nh"></h2>
          <div class="grid" id="nw"></div>
        </div>
      </section>

      <!-- Call to action -->
      <section class="cta">
        <div class="w">
          <h2 data-t="ch"></h2>
          <p data-t="cp"></p>

          <div class="row" style="justify-content:center">
            <a class="btn s" href="#involved" data-t="b3"></a>
            <a class="btn o" href="#contact" data-t="sup"></a>
          </div>
        </div>
      </section>

      <!-- Contact section -->
      <section id="contact">
        <div class="w two rv">
          <div>
            <div class="eyebrow" data-t="n8"></div>
            <h2 data-t="kh"></h2>
            <p>
              <b>Email:</b> <span data-t="kph"></span><br>
              <b>Tel:</b> <span data-t="kph"></span><br>
              <b data-t="ka"></b> <span data-t="kph"></span>
            </p>
            <p class="note" data-t="kn"></p>

            <div class="pic" style="aspect-ratio:16/9">
              <span data-t="km"></span>
            </div>
          </div>

          <form id="fm" novalidate>
            <input id="f1" data-p="fn" required>
            <input id="f2" type="email" data-p="fe2" required>
            <textarea id="f3" rows="5" data-p="fm" required></textarea>
            <button class="btn" type="submit" data-t="fs2"></button>
            <div id="msg" role="status"></div>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="w">© 2026 Dhireynta Dhulka Initiative (DDI) · <span data-t="tg2"></span></div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
